  # Books / lecterns / special interaction
  - LECTERN
  - COMPOSTER
  - BELL
  - RESPAWN_ANCHOR
  - LODESTONE
  - VAULT
  - TRIAL_SPAWNER

  # Copper bulbs / interactive light-style blocks
