  # Furnaces / brewing
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - BREWING_STAND

  # Workstations / utility blocks
  - CRAFTING_TABLE
  - CRAFTER
  - ENCHANTING_TABLE
  - ANVIL
  - CHIPPED_ANVIL
  - DAMAGED_ANVIL
  - GRINDSTONE
  - LOOM
