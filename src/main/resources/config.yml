  - WAXED_EXPOSED_COPPER_BULB
  - WAXED_WEATHERED_COPPER_BULB
  - WAXED_OXIDIZED_COPPER_BULB

# Automatically treat common interactive entities as read-only
readonly-entities-auto: true

# Extra entities to treat as read-only (EntityType names)
readonly-entities:
  - ITEM_FRAME
  - GLOW_ITEM_FRAME
  - ARMOR_STAND

  # Boats / rafts
  - OAK_BOAT
  - SPRUCE_BOAT
  - BIRCH_BOAT
  - JUNGLE_BOAT
  - ACACIA_BOAT
  - DARK_OAK_BOAT
  - MANGROVE_BOAT
  - CHERRY_BOAT
  - PALE_OAK_BOAT
  - BAMBOO_RAFT

  # Chest boats / chest rafts
  - OAK_CHEST_BOAT
  - SPRUCE_CHEST_BOAT
  - BIRCH_CHEST_BOAT
  - JUNGLE_CHEST_BOAT
  - ACACIA_CHEST_BOAT
  - DARK_OAK_CHEST_BOAT
  - MANGROVE_CHEST_BOAT
