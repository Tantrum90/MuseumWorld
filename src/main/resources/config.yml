# MuseumWorld configuration

# Which worlds should be treated as read-only
locked-worlds: []

# Example:
# locked-worlds:
#   - overworld
#   - the_nether
#   - the_end
#   - Lobby

# Notify players when an action is blocked
notify-player: true

# Language file to use for messages (messages_en.yml, messages_mk.yml)
language: en

# If true, MuseumWorld will print protection debug information to the console.
# Useful for testing why something is blocked or allowed.
debug-mode: false

# If true, MuseumWorld will print a startup summary when the plugin is enabled.
startup-summary-enabled: false

# Message throttling to prevent chat spam
messages:
  # Minimum time (ms) between repeating the same message to the same player.
  # Some events (like repeated interactions) can otherwise spam chat.
  cooldown-ms: 2500

# If true, damage protection is applied only to entity types listed under blocked-entity-types.
# Entity types not listed there can still be damaged in locked worlds.
block-entity-damage: true

# Block players from dropping items in locked worlds.
block-item-drop: true

# Block players from picking up dropped items in locked worlds.
block-item-pickup: true

# Block bucket fill/empty actions in locked worlds.
block-bucket-use: true

# Block flint and steel, fire charges, and fire ignition in locked worlds.
block-fire-use: true

# Block natural growth/spread/decay changes in locked worlds.
# Recommended false by default because it can be more aggressive.
block-natural-growth: false

# Block bone meal use in locked worlds.
block-bone-meal-use: true

# Block Nether portal creation in locked worlds.
block-portal-creation: true

# Block item frame rotation in locked worlds.
block-item-frame-rotation: true

# Block armor stand manipulation in locked worlds.
block-armor-stand-manipulation: true

# Block TNT ignition in locked worlds.
block-tnt-ignite: true

# Block bed use in locked worlds.
block-player-bed-use: true

# Block breaking/removing paintings, item frames, leash knots and other hanging entities.
block-hanging-break: true

# Block placing/breaking boats, rafts, minecarts and similar vehicles in locked worlds.
block-vehicle-place-break: true

# Block players from entering boats, rafts, minecarts and other vehicles in locked worlds.
# Useful when vehicles are used as decoration in museum/showcase worlds.
block-vehicle-enter: false

# Block throwing eggs, ender pearls, splash potions, arrows and similar projectiles/items
# that can affect the world or entities.
block-projectile-use: true

# If true, firework rockets are still allowed for Elytra boosting
# while the player is gliding with Elytra equipped.
allow-elytra-firework-boost: true

# Block placing/removing leads on entities and fences.
block-lead-use: true

# Block name tags on entities in locked worlds.
block-name-tag-use: true

