# MuseumWorld configuration

# Which worlds should be treated as read-only
locked-worlds: []
# Example:
# locked-worlds:
#   - overworld
#   - the_nether
#   - the_end
#   - Lobby

# Notify players when an action is blocked
notify-player: true

# Language file to use for messages (messages_en.yml, messages_mk.yml)
language: en

# If true, MuseumWorld will print protection debug information to the console.
# Useful for testing why something is blocked or allowed.
debug-mode: false

# If true, MuseumWorld will print a startup summary when the plugin is enabled.
startup-summary-enabled: false

# Message throttling to prevent chat spam
messages:
  # Minimum time (ms) between repeating the same message to the same player.
  # Some events (like repeated interactions) can otherwise spam chat.
  cooldown-ms: 2500

# Block damaging ANY entities in locked worlds
block-entity-damage: true

# Legacy setting kept for compatibility: block damage to friendly/passive mobs
block-friendly-damage: true

# Additionally block damaging these entity types (even if block-entity-damage is false)
blocked-entity-types:
  - ALLAY
  - ARMADILLO
  - AXOLOTL
  - BAT
  - BEE
  - CAMEL
  - CAT
  - CHICKEN
  - COD
  - COPPER_GOLEM
  - COW
  - DOLPHIN
  - DONKEY
  - FOX
  - FROG
  - GLOW_SQUID
  - GOAT
  - HAPPY_GHAST
  - HORSE
  - IRON_GOLEM
  - LLAMA
  - MANNEQUIN
  - MOOSHROOM
  - MULE
  - NAUTILUS
  - OCELOT
  - PANDA
  - PARROT
  - PIG
  - POLAR_BEAR
  - PUFFERFISH
  - RABBIT
  - SALMON
  - SHEEP
  - SKELETON_HORSE
  - SNIFFER
  - SNOW_GOLEM
  - SQUID
  - STRIDER
  - TADPOLE
  - TRADER_LLAMA
  - TROPICAL_FISH
  - TURTLE
  - VILLAGER
  - WANDERING_TRADER
  - WOLF
  - ZOMBIE_HORSE

# Block interactions with "read-only" blocks/entities (see lists below)
block-readonly-interactions: true

# Automatically treat common containers/interactive blocks as read-only
readonly-blocks-auto: true

# Extra blocks to treat as read-only (Material names)
readonly-blocks:
  # Containers / storage
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - ENDER_CHEST
  - HOPPER
  - DISPENSER
  - DROPPER
  - CHISELED_BOOKSHELF
