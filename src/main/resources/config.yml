  - HOPPER_MINECART
  - FURNACE_MINECART
  - TNT_MINECART
  - COMMAND_BLOCK_MINECART
  - SPAWNER_MINECART

  # Hanging entities (optional, but typical for “museum” worlds)
  - PAINTING
  - LEASH_KNOT
  - MANNEQUIN

# Blocks that players can open and view, but cannot modify.
# These blocks are allowed to open, while item movement is blocked separately.
# If a block is removed from this list but remains in readonly-blocks,
# right-click interaction with that block will be fully blocked.
view-only-containers:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - ENDER_CHEST
  - HOPPER
  - DISPENSER
  - DROPPER
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - BREWING_STAND
  - LECTERN
  - CHISELED_BOOKSHELF
  - COMPOSTER
  - BEACON

  # Shulker boxes
  - SHULKER_BOX
  - WHITE_SHULKER_BOX
  - ORANGE_SHULKER_BOX
  - MAGENTA_SHULKER_BOX
  - LIGHT_BLUE_SHULKER_BOX
  - YELLOW_SHULKER_BOX
  - LIME_SHULKER_BOX
  - PINK_SHULKER_BOX
  - GRAY_SHULKER_BOX
  - LIGHT_GRAY_SHULKER_BOX
  - CYAN_SHULKER_BOX
  - PURPLE_SHULKER_BOX
  - BLUE_SHULKER_BOX
  - BROWN_SHULKER_BOX
  - GREEN_SHULKER_BOX
  - RED_SHULKER_BOX
  - BLACK_SHULKER_BOX

# These keys are protected during automatic config updates.
# The plugin will not overwrite them from the default config.
# Keep "locked-worlds" here to protect your selected worlds.
# Keep "language" selection not to reset during updates.

protected-config-keys:
  - locked-worlds
  - language

# If true, the plugin will create/update config-reference.yml on startup.
# This file keeps the default commented configuration for reference.
# The plugin does not read settings from config-reference.yml.
create-config-reference: true

# Maximum number of automatic config backups to keep.
# Set to 0 or a negative number to disable automatic cleanup.
max-config-backups: 5

# If true, the plugin will create a backup of config.yml before saving automatic config updates.
backup-config-before-auto-update: true

# If true, the plugin will add missing values from default config lists
# into your existing config lists on the next reload/startup.
# Existing values are kept. Nothing is removed.
# The lists listed in protected-config-keys are never auto-updated.
# After a successful update, this will automatically return to false.
update-lists-on-next-reload: false

# If true, MuseumWorld will automatically remove invalid Material/EntityType names
# from active config lists after creating a backup and validation report.
# This only applies to:
# - readonly-blocks
# - view-only-containers
# - readonly-entities
# - blocked-entity-types
auto-clean-invalid-config-values: true

config-version: 7